name: Trello API Tests CI

on:
  push:
    branches: [ BDD-with-Cucumber ]
  pull_request:
    branches: [ BDD-with-Cucumber ]

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Create .env file
      run: |
        echo "TRELLO_API_KEY=${{ secrets.TRELLO_API_KEY }}" > .env
        echo "TRELLO_API_TOKEN=${{ secrets.TRELLO_API_TOKEN }}" >> .env
        echo "TRELLO_KEY=${{ secrets.TRELLO_API_KEY }}" >> .env
        echo "TRELLO_TOKEN=${{ secrets.TRELLO_API_TOKEN }}" >> .env

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      env:
        TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
        TRELLO_API_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
        TRELLO_KEY: ${{ secrets.TRELLO_API_KEY }}
        TRELLO_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
        CUCUMBER_PUBLISH_QUIET: true
      run: |
        npx @cucumber/cucumber --format json:cucumber_report.json --require features/**/*.js

    - name: Archive test results
      if: always()
      run: |
        mkdir -p artifacts
        cp -r reports/* artifacts/ || true
        cp cucumber_report.json artifacts/ || true
        cp cucumber-report.html artifacts/ || true

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@main
      with:
        name: test-results-node-${{ matrix.node-version }}
        path: artifacts/
        if-no-files-found: warn

    - name: Publish Cucumber Report
      if: always()
      uses: deblockt/cucumber-report-annotations-action@v1.7
      with:
        access-token: ${{ secrets.GITHUB_TOKEN }}
        path: "**/cucumber-report.json" 