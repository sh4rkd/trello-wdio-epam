name: Trello API Tests CI

on:
  push:
    branches: [ BDD-with-Cucumber ]
  pull_request:
    branches: [ BDD-with-Cucumber ]

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    environment: test

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Super Debug Environment
      run: |
        echo "=== GitHub Context Variables ==="
        echo "GITHUB_WORKFLOW: $GITHUB_WORKFLOW"
        echo "GITHUB_ACTION: $GITHUB_ACTION"
        echo "GITHUB_ACTOR: $GITHUB_ACTOR"
        echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
        echo "GITHUB_EVENT_NAME: $GITHUB_EVENT_NAME"
        echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
        echo "GITHUB_SHA: $GITHUB_SHA"
        echo "GITHUB_REF: $GITHUB_REF"
        
        echo "\n=== Environment Variables ==="
        env | sort
        
        echo "\n=== Secrets Check (will only show true/false) ==="
        echo "secrets.TRELLO_API_KEY exists: ${{ secrets.TRELLO_API_KEY != '' }}"
        echo "secrets.TRELLO_API_TOKEN exists: ${{ secrets.TRELLO_API_TOKEN != '' }}"
        echo "secrets.TRELLO_KEY exists: ${{ secrets.TRELLO_KEY != '' }}"
        echo "secrets.TRELLO_TOKEN exists: ${{ secrets.TRELLO_TOKEN != '' }}"
        
        echo "\n=== Variables Check ==="
        echo "vars.TRELLO_API_KEY exists: ${{ vars.TRELLO_API_KEY != '' }}"
        echo "vars.TRELLO_API_TOKEN exists: ${{ vars.TRELLO_API_TOKEN != '' }}"
        echo "vars.TRELLO_KEY exists: ${{ vars.TRELLO_KEY != '' }}"
        echo "vars.TRELLO_TOKEN exists: ${{ vars.TRELLO_TOKEN != '' }}"
        
        echo "\n=== Environment Variables Detail ==="
        echo "Current Environment: ${{ env.ENVIRONMENT }}"
        echo "Current Environment Name: ${{ env.ENVIRONMENT_NAME }}"
        
        echo "\n=== Runner Context ==="
        echo "Runner OS: ${{ runner.os }}"
        echo "Runner Name: ${{ runner.name }}"
        echo "Runner Temp: ${{ runner.temp }}"
        echo "Workspace: ${{ runner.workspace }}"
        
        echo "\n=== GitHub Context ==="
        echo "Event Name: ${{ github.event_name }}"
        echo "Repository: ${{ github.repository }}"
        echo "Ref: ${{ github.ref }}"
        echo "SHA: ${{ github.sha }}"
        echo "Workspace: ${{ github.workspace }}"
        
        echo "\n=== Job Context ==="
        echo "Job ID: ${{ job.id }}"
        echo "Job Container ID: ${{ job.container.id }}"
        echo "Job Services: ${{ job.services }}"
        
        echo "\n=== Steps Context ==="
        echo "Current Step ID: ${{ steps.id }}"
        echo "Current Step Number: ${{ steps.number }}"
        
        echo "\n=== All Environment Variables ==="
        printenv

    - name: Create .env file
      run: |
        echo "Creating .env file with all possible combinations..."
        
        # Direct secrets
        echo "TRELLO_API_KEY=${{ secrets.TRELLO_API_KEY }}" >> .env
        echo "TRELLO_API_TOKEN=${{ secrets.TRELLO_API_TOKEN }}" >> .env
        echo "TRELLO_KEY=${{ secrets.TRELLO_KEY }}" >> .env
        echo "TRELLO_TOKEN=${{ secrets.TRELLO_TOKEN }}" >> .env
        
        # Variables if they exist
        echo "TRELLO_API_KEY_VAR=${{ vars.TRELLO_API_KEY }}" >> .env
        echo "TRELLO_API_TOKEN_VAR=${{ vars.TRELLO_API_TOKEN }}" >> .env
        
        # Environment variables if they exist
        echo "TRELLO_API_KEY_ENV=${{ env.TRELLO_API_KEY }}" >> .env
        echo "TRELLO_API_TOKEN_ENV=${{ env.TRELLO_API_TOKEN }}" >> .env
        
        echo "=== Content of .env file (masked) ==="
        cat .env | sed 's/\(.*=\).*/\1****/'

    - name: Run tests
      env:
        # Try all possible combinations
        TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
        TRELLO_API_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
        TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
        TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        TRELLO_API_KEY_VAR: ${{ vars.TRELLO_API_KEY }}
        TRELLO_API_TOKEN_VAR: ${{ vars.TRELLO_API_TOKEN }}
        TRELLO_API_KEY_ENV: ${{ env.TRELLO_API_KEY }}
        TRELLO_API_TOKEN_ENV: ${{ env.TRELLO_API_TOKEN }}
        NODE_ENV: test
        CUCUMBER_PUBLISH_QUIET: true
      run: |
        echo "=== Final Environment Check ==="
        echo "TRELLO_API_KEY length: ${#TRELLO_API_KEY}"
        echo "TRELLO_API_TOKEN length: ${#TRELLO_API_TOKEN}"
        echo "TRELLO_KEY length: ${#TRELLO_KEY}"
        echo "TRELLO_TOKEN length: ${#TRELLO_TOKEN}"
        echo "TRELLO_API_KEY_VAR length: ${#TRELLO_API_KEY_VAR}"
        echo "TRELLO_API_TOKEN_VAR length: ${#TRELLO_API_TOKEN_VAR}"
        echo "TRELLO_API_KEY_ENV length: ${#TRELLO_API_KEY_ENV}"
        echo "TRELLO_API_TOKEN_ENV length: ${#TRELLO_API_TOKEN_ENV}"
        
        echo "\n=== Running Tests ==="
        echo "Running with Node $(node -v)"
        npx cucumber-js \
          --format json:cucumber_report.json \
          --require features/step_definitions/**/*.js \
          --require features/support/**/*.js \
          features/**/*.feature

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cucumber-report
        path: cucumber_report.json

    - name: Archive test results
      if: always()
      run: |
        mkdir -p artifacts
        cp -r reports/* artifacts/ || true
        cp cucumber_report.json artifacts/ || true
        cp cucumber-report.html artifacts/ || true

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-node-${{ matrix.node-version }}
        path: artifacts/
        if-no-files-found: warn

    - name: Publish Cucumber Report
      if: always()
      uses: deblockt/cucumber-report-annotations-action@v1.7
      with:
        access-token: ${{ secrets.GITHUB_TOKEN }}
        path: "**/cucumber-report.json" 