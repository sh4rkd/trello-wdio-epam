name: Trello API Tests CI

on:
  push:
    branches: [ BDD-with-Cucumber ]
  pull_request:
    branches: [ BDD-with-Cucumber ]

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Debug Environment
      run: |
        echo "Checking secrets availability..."
        if [ -n "${{ secrets.TRELLO_API_KEY }}" ]; then echo "TRELLO_API_KEY is set"; else echo "TRELLO_API_KEY is NOT set"; fi
        if [ -n "${{ secrets.TRELLO_API_TOKEN }}" ]; then echo "TRELLO_API_TOKEN is set"; else echo "TRELLO_API_TOKEN is NOT set"; fi

    - name: Create .env file
      run: |
        cat > .env << EOL
        #add mores posibilities to find the secrets 
        # Debugging secrets and variables
        echo "Debugging secrets and variables..."
        
        # Check GitHub Actions context variables
        echo "GitHub Actions Context:"
        echo "GITHUB_REF: $GITHUB_REF"
        echo "GITHUB_SHA: $GITHUB_SHA"
        echo "GITHUB_WORKFLOW: $GITHUB_WORKFLOW"
        echo "GITHUB_ACTOR: $GITHUB_ACTOR"
        
        # Check environment variables
        echo "Environment Variables:"
        env | grep -i "TRELLO\|GITHUB\|NODE" || true
        
        # Check GitHub Actions variables
        echo "GitHub Actions Variables:"
        echo "github.event_name: ${{ github.event_name }}"
        echo "github.repository: ${{ github.repository }}"
        echo "github.workspace: ${{ github.workspace }}"
        
        # Check secrets availability with more detail
        echo "Secrets Status:"
        if [ -n "${{ secrets.TRELLO_API_KEY }}" ]; then 
          echo "TRELLO_API_KEY is set (length: ${#TRELLO_API_KEY})"
        else 
          echo "TRELLO_API_KEY is NOT set"
        fi
        
        if [ -n "${{ secrets.TRELLO_API_TOKEN }}" ]; then 
          echo "TRELLO_API_TOKEN is set (length: ${#TRELLO_API_TOKEN})"
        else 
          echo "TRELLO_API_TOKEN is NOT set"
        fi
        
        # Check for alternative secret names
        echo "Checking alternative secret names..."
        if [ -n "${{ secrets.TRELLO_KEY }}" ]; then echo "TRELLO_KEY is set"; fi
        if [ -n "${{ secrets.TRELLO_TOKEN }}" ]; then echo "TRELLO_TOKEN is set"; fi
        if [ -n "${{ secrets.TRELLO_ACCESS_KEY }}" ]; then echo "TRELLO_ACCESS_KEY is set"; fi
        if [ -n "${{ secrets.TRELLO_ACCESS_TOKEN }}" ]; then echo "TRELLO_ACCESS_TOKEN is set"; fi
        
        # Check repository variables
        echo "Repository Variables:"
        if [ -n "${{ vars.TRELLO_API_KEY }}" ]; then echo "TRELLO_API_KEY in vars is set"; fi
        if [ -n "${{ vars.TRELLO_API_TOKEN }}" ]; then echo "TRELLO_API_TOKEN in vars is set"; fi
        
        # Print masked versions for debugging
        echo "Masked Secrets:"
        echo "TRELLO_API_KEY: ${TRELLO_API_KEY:0:4}...${TRELLO_API_KEY: -4}"
        echo "TRELLO_API_TOKEN: ${TRELLO_API_TOKEN:0:4}...${TRELLO_API_TOKEN: -4}"
        secrets=${{ secrets}}
        TRELLO_API_KEY=${{ secrets.TRELLO_API_KEY }}
        TRELLO_API_TOKEN=${{ secrets.TRELLO_API_TOKEN }}
        TRELLO_KEY=${{ secrets.TRELLO_API_KEY }}
        TRELLO_TOKEN=${{ secrets.TRELLO_API_TOKEN }}
        EOL
        echo "Created .env file"
        ls -la .env

    - name: Run tests
      env:
        TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
        TRELLO_API_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
        TRELLO_KEY: ${{ secrets.TRELLO_API_KEY }}
        TRELLO_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
        NODE_ENV: test
        CUCUMBER_PUBLISH_QUIET: true
      run: |
        echo "Running tests with Node $(node -v)"
        echo "Environment variables set:"
        env | grep -i TRELLO || true
        npx @cucumber/cucumber \
          --format json:cucumber_report.json \
          --require features/step_definitions/**/*.js \
          --require features/support/**/*.js \
          features/**/*.feature

    - name: Archive test results
      if: always()
      run: |
        mkdir -p artifacts
        cp -r reports/* artifacts/ || true
        cp cucumber_report.json artifacts/ || true
        cp cucumber-report.html artifacts/ || true

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@main
      with:
        name: test-results-node-${{ matrix.node-version }}
        path: artifacts/
        if-no-files-found: warn

    - name: Publish Cucumber Report
      if: always()
      uses: deblockt/cucumber-report-annotations-action@v1.7
      with:
        access-token: ${{ secrets.GITHUB_TOKEN }}
        path: "**/cucumber-report.json" 