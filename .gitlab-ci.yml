image: node:latest

stages:
  - lint
  - test

cache:
  paths:
    - node_modules/

before_script:
  - npm install

lint:
  stage: lint
  script:
    - npm run lint
    - npm run format:check

test:
  stage: test
  script:
    - npm run test
  artifacts:
    when: always
    paths:
      - allure-results/
      - spec-reports/
    reports:
      junit: spec-reports/*.xml 