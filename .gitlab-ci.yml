image: node:18-lts

stages:
  - lint
  - test

cache:
  paths:
    - node_modules/

lint:
  stage: lint
  script:
    - npm ci
    - npm run lint
    - npm run format:check
  artifacts:
    reports:
      junit: junit.xml
    when: always
    expire_in: 1 week

test:ui:
  stage: test
  script:
    - npm ci
    - npm run test:chrome
  artifacts:
    reports:
      junit: junit.xml
    when: always
    expire_in: 1 week

test:api:
  stage: test
  script:
    - npm ci
    - npm run test:api
  artifacts:
    reports:
      junit: junit.xml
    when: always
    expire_in: 1 week 