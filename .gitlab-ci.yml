image: node:latest

stages:
  - lint
  - test

cache:
  paths:
    - node_modules/

before_script:
  - npm install
  - pwd
  - ls -la

lint:
  stage: lint
  script:
    - npm run lint
    - npm run format:check
  artifacts:
    paths:
      - .eslintrc.json
      - .prettierrc

test:
  stage: test
  script:
    - npm run test
  artifacts:
    when: always
    paths:
      - allure-results/
      - spec-reports/
    reports:
      junit: spec-reports/*.xml 